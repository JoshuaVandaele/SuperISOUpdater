[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sisou"
version = "2.5.0"
authors = [{ name = "Joshua Vandaele", email = "joshua@vandaele.software" }]
license = "GPL-2.0-or-later"
keywords = [
    "ventoy",
    "iso",
    "updater",
    "downloader",
    "cli",
    "os",
    "linux",
    "windows",
    "sysadmin",
    "bootable",
    "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
description = "A powerful tool to conveniently update all of your ISO files!"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10, <4"
dependencies = [
    "beautifulsoup4~=4.15",
    "python-gnupg~=0.5",
    "requests-cache~=1.3",
    "requests~=2.34",
    "tqdm~=4.70",
    "aria2",
    "aria2p~=0.12",
]

[project.urls]
Homepage = "https://github.com/JoshuaVandaele/SuperISOUpdater"
"Bug Reports" = "https://github.com/JoshuaVandaele/SuperISOUpdater/issues"
Source = "https://github.com/JoshuaVandaele/SuperISOUpdater"

[project.scripts]
sisou = "sisou:main"

[tool.setuptools]
py-modules = ["sisou"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.data-files]
"sisou/config" = ["config/sisou.toml.default"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE", "PYI", "SIM", "RUF"]
ignore = ["LOG015", "B019", "BLE001"]

[dependency-groups]
dev = ["ruff~=0.16"]
